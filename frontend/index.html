<!doctype html>
<html lang="en" data-theme="black" data-density="compact" data-shortcuts="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MediaFlow, a self-hosted download manager for qBittorrent and Jellyfin.">
  <title>MediaFlow</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/boot.js"></script>
  <!-- Plain scripts so index.html opens directly from disk. Each file uses what the ones above it export. -->
  <script defer src="js/prefs.js"></script>
  <script defer src="js/dom.js"></script>
  <script defer src="js/format.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/navigation.js"></script>
  <script defer src="js/components/toast.js"></script>
  <script defer src="js/components/dialog.js"></script>
  <script defer src="js/components/form.js"></script>
  <script defer src="js/components/sign-in-dialog.js"></script>
  <script defer src="js/components/states.js"></script>
  <script defer src="js/components/service-status.js"></script>
  <script defer src="js/components/remove-dialog.js"></script>
  <script defer src="js/components/download-actions.js"></script>
  <script defer src="js/components/download-table.js"></script>
  <script defer src="js/components/add-dialog.js"></script>
  <script defer src="js/components/organization-settings.js"></script>
  <script defer src="js/components/library-sync.js"></script>
  <script defer src="js/components/jellyfin-settings.js"></script>
  <script defer src="js/components/media-images.js"></script>
  <script defer src="js/components/media-card.js"></script>
  <script defer src="js/components/command-palette.js"></script>
  <script defer src="js/pages/overview.js"></script>
  <script defer src="js/pages/downloads.js"></script>
  <script defer src="js/pages/imports.js"></script>
  <script defer src="js/pages/library-browse.js"></script>
  <script defer src="js/pages/library-overview.js"></script>
  <script defer src="js/pages/library-item.js"></script>
  <script defer src="js/pages/settings.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#view">Skip to content</a>

  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M12 7.5v8M8.5 12l3.5 3.5 3.5-3.5"/></symbol>
    <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></symbol>
    <symbol id="i-downloads" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 5v5h5M5 10a8 8 0 1 1-1 4.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7.5v5.5M12 16.5v.5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6.5 10.5L12 5l5.5 5.5"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6.5 13.5L12 19l5.5-5.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 5h6l2 3h10v11H3z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4h5v16H4zM11 4h5v16h-5zM18 5l2.5.6-1.2 14.6-2.3-.4"/></symbol>
    <symbol id="i-media" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 9v6l5-3z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 4v16M16 4v16M4 9h4M4 15h4M16 9h4M16 15h4"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><path d="M3 7h18v12H3zM8 3l4 4 4-4"/></symbol>
    <symbol id="i-anime" viewBox="0 0 24 24"><path d="M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><path d="M4 9h16v11H4zM6 6h12M8 3h8"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/overview" aria-label="MediaFlow, go to overview">
        <svg class="icon" aria-hidden="true"><use href="#i-logo"/></svg>
        <span class="brand-name rail-hidden">MediaFlow</span>
      </a>

      <nav class="nav" aria-label="Main">
        <ul class="nav-list">
          <li><a class="nav-link" href="#/overview" data-route="overview" title="Overview">
            <svg class="icon" aria-hidden="true"><use href="#i-overview"/></svg>
            <span class="rail-hidden">Overview</span>
          </a></li>
          <li><a class="nav-link" href="#/downloads" data-route="downloads" title="Downloads">
            <svg class="icon" aria-hidden="true"><use href="#i-downloads"/></svg>
            <span class="rail-hidden">Downloads</span>
            <span class="nav-count rail-hidden" id="nav-download-count"></span>
          </a></li>
          <li><a class="nav-link" href="#/imports" data-route="imports" title="Imports">
            <svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>
            <span class="rail-hidden">Imports</span>
            <span class="nav-count rail-hidden" id="nav-imports-count" title="Imports that failed or wait for review"></span>
          </a></li>
        </ul>

        <p class="nav-heading rail-hidden" id="nav-library-heading">Library</p>
        <ul class="nav-list nav-group" aria-labelledby="nav-library-heading">
          <li><a class="nav-link" href="#/library" data-route="library" title="Library overview">
            <svg class="icon" aria-hidden="true"><use href="#i-library"/></svg>
            <span class="rail-hidden">Overview</span>
          </a></li>
          <li><a class="nav-link" href="#/library/all" data-route="library/all" title="All media">
            <svg class="icon" aria-hidden="true"><use href="#i-media"/></svg>
            <span class="rail-hidden">All media</span>
          </a></li>
          <li><a class="nav-link" href="#/library/movies" data-route="library/movies" title="Movies">
            <svg class="icon" aria-hidden="true"><use href="#i-film"/></svg>
            <span class="rail-hidden">Movies</span>
          </a></li>
          <li><a class="nav-link" href="#/library/series" data-route="library/series" title="Series">
            <svg class="icon" aria-hidden="true"><use href="#i-tv"/></svg>
            <span class="rail-hidden">Series</span>
          </a></li>
          <li><a class="nav-link" href="#/library/anime" data-route="library/anime" title="Anime">
            <svg class="icon" aria-hidden="true"><use href="#i-anime"/></svg>
            <span class="rail-hidden">Anime</span>
          </a></li>
          <li><a class="nav-link" href="#/library/collections" data-route="library/collections" title="Collections">
            <svg class="icon" aria-hidden="true"><use href="#i-stack"/></svg>
            <span class="rail-hidden">Collections</span>
          </a></li>
        </ul>

        <ul class="nav-list nav-group">
          <li><a class="nav-link" href="#/settings" data-route="settings" title="Settings">
            <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
            <span class="rail-hidden">Settings</span>
          </a></li>
        </ul>
      </nav>

      <section class="services" aria-label="Connections">
        <ul class="services-list" id="services"></ul>
      </section>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <h1 class="page-title" id="page-title" tabindex="-1">MediaFlow</h1>
        <div class="topbar-actions">
          <a class="system-indicator" id="system-indicator" href="#/settings"></a>
          <button class="btn search-btn" id="search-btn" type="button" aria-label="Search">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <span class="btn-label">Search</span>
            <kbd id="search-kbd">Ctrl K</kbd>
          </button>
          <button class="btn btn-primary add-btn" id="add-btn" type="button" aria-label="Add download">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
            <span class="btn-label">Add download</span>
          </button>
        </div>
      </header>

      <div class="api-alert" id="api-alert" role="alert" hidden></div>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <noscript><p class="boot-message">MediaFlow needs JavaScript to run.</p></noscript>
</body>
</html>
