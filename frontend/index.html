<!doctype html>
<html lang="en" data-theme="black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depot</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/overview">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M12 7.5v8M8.5 12l3.5 3.5 3.5-3.5"/></svg>
        <span>Depot</span>
      </a>
      <nav class="nav" id="nav" aria-label="Main"></nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Menu">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="page-title" id="page-title"></h1>
        <div class="topbar-actions" id="topbar-actions"></div>
        <div class="services" id="services"></div>
      </header>
      <div class="banner" id="banner" hidden></div>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
